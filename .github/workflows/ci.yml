name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  checks:
    name: lint and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  retrieval-gate:
    name: real-data tests and retrieval regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/raw
            artifacts/models
          key: cuad-data-models-${{ hashFiles('uv.lock') }}
      - run: uv sync --locked
      - name: Real-data tests (CUAD archive and ONNX models)
        run: uv run pytest -q -m network
      - name: Committed dev reports are reproduced by the code
        run: |
          foreach ($retriever in "bm25", "bm25-lead") {
            uv run cuad-qa --log-level WARNING evaluate --split dev --retriever $retriever
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --exit-code -- reports/bm25-baseline-dev.json reports/bm25-lead-baseline-dev.json
      - name: Dev recall@10 does not drop more than 2 points against the base
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($retriever in "bm25", "bm25-lead") {
            $report = "reports/$retriever-baseline-dev.json"
            git show "${env:BASE}:$report" > "artifacts/base-$retriever-dev.json"
            if ($LASTEXITCODE -ne 0) {
              Write-Output "No $report at ${env:BASE}; nothing to compare against."
              continue
            }
            uv run cuad-qa gate --baseline "artifacts/base-$retriever-dev.json" --candidate $report
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0
