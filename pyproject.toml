[project]
name = "cuad-doc-qa"
version = "0.1.0"
description = "Document Q&A with verifiable citations over the CUAD contract corpus."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.0",
    "numpy>=2.5.4",
]

[project.scripts]
cuad-qa = "cuad_doc_qa.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m",
    "not network",
]
markers = ["network: needs internet access; deselected by default, select with -m network"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
